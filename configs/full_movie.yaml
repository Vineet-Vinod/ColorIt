model:
  repo_id: spensercai/DeOldify
  filename: ColorizeVideo_gen.pth
  weights_path: models/deoldify/ColorizeVideo_gen.pth
  render_factor: 17

runtime:
  backend_preference: mps
  fallback_backend: cpu
  num_workers: 1
  inference_batch_size: 16
  torch_compile: true
  torch_compile_mode: default
  cleanup_frames: true
  cleanup_scene_clips: true

video:
  output_codec: libx264
  crf: 16
  pixel_format: yuv420p

compression:
  video_codec: libx264
  preset: medium
  crf: 20
  max_size_multiplier: 2.0
  retry_crfs: [23, 26, 28]
  audio_codec: aac
  audio_bitrate: 160k
  faststart: true

background_stabilization:
  enabled: true
  strength: 0.85
  chroma_damping: 0.55
  min_mask_fraction: 0.06
  max_chroma: 64.0
  highlight_luma_min: 120.0
  highlight_max_chroma: 180.0
  highlight_neutral_damping: 0.15
  highlight_gradient_multiplier: 3.0
  shadow_luma_max: 82.0
  shadow_max_chroma: 72.0
  shadow_neutral_damping: 0.55
  shadow_gradient_multiplier: 2.2
  edge_min_gradient_multiplier: 3.2
  edge_max_chroma: 88.0
  edge_neutral_damping: 0.68
  static_enabled: true
  static_luma_tolerance: 10.0
  static_update_alpha: 0.04
  static_min_confidence: 0.25
  static_chroma_blend: 0.82
  static_confidence_gain: 0.08
  static_confidence_decay: 0.05
  static_reference_update_alpha: 0.01
  static_max_chroma: 190.0
  max_gradient: 7.5
  shot_change_threshold: 18.0
  feather_radius: 9

scenes:
  detect: true
  threshold: 0.60
  min_scene_seconds: 2.0
  max_scene_seconds: 90.0
  overlap_seconds: 0.0

paths:
  scene_dir: data/scenes
  frames_dir: data/frames
  colorized_dir: data/colorized
  manifest_dir: data/manifests
  final_dir: data/final
