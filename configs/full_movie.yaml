model:
  repo_id: spensercai/DeOldify
  filename: ColorizeVideo_gen.pth
  weights_path: models/deoldify/ColorizeVideo_gen.pth
  render_factor: 17

runtime:
  backend_preference: mps
  fallback_backend: cpu
  num_workers: 1
  deterministic: true
  frame_transport: pipe
  inference_batch_size: 16
  torch_compile: true
  torch_compile_mode: default
  cleanup_frames: true
  cleanup_scene_clips: true

video:
  preserve_fps: true
  output_codec: libx264
  crf: 16
  pixel_format: yuv420p

compression:
  enabled: true
  video_codec: libx264
  preset: medium
  crf: 20
  max_size_multiplier: 2.0
  retry_crfs: [23, 26, 28]
  audio_codec: aac
  audio_bitrate: 160k
  faststart: true

scenes:
  detect: true
  threshold: 0.60
  min_scene_seconds: 2.0
  max_scene_seconds: 90.0
  overlap_seconds: 0.0

postprocess:
  temporal_smoothing: false
  smoothing_strength: 0.0
  smoothing_chroma_threshold: 24.0
  adaptive_smoothing_boost: 0.0
  warmth: 0.0
  shadow_warmth: 0.0
  blue_reduction: 0.0

paths:
  scene_dir: data/scenes
  frames_dir: data/frames
  colorized_dir: data/colorized
  manifest_dir: data/manifests
  final_dir: data/final
