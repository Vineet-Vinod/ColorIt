[project]
name = "colorit"
version = "0.1.0"
description = "Movie-first DeOldify pipeline for black-and-white film colorization"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7.0",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "tqdm>=4.67,<5",
]

[project.scripts]
colorit = "src.cli:main"

[project.optional-dependencies]
experimental = [
  "mflux==0.19.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pydantic>=2,<3",
  "scikit-image>=0.25,<1",
  "einops>=0.8,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "mypy>=1,<3", "ruff>=0.11,<1", "taskipy>=1,<2"]

[tool.taskipy.tasks]
lint = "ruff check src/experimental tests src/cli.py src/pipeline/weights.py src/pipeline/pipeline_dataclasses.py"
types = "mypy --strict --follow-imports skip --ignore-missing-imports src/experimental tests src/pipeline/weights.py src/pipeline/pipeline_dataclasses.py"
test = "python -m pytest tests -q"
ci = "task lint && task types && task test"

[tool.setuptools.package-data]
"src.experimental" = ["*.patch"]

[[tool.mypy.overrides]]
module = ["pydantic.*", "pytest.*", "_pytest.*"]
follow_imports = "normal"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src", "src.*"]
